services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gymsense:gymsense@postgres:5432/gymsense
      CORS_ORIGINS: http://localhost:8080
      ENVIRONMENT: production-like
      APP_VERSION: 0.1.0
    ports:
      - "8000:8000" # exposed for direct API/docs access + debugging; the app itself talks to it via the Nginx /api proxy below
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: "" # empty = relative requests, so the browser calls same-origin Nginx, which proxies to the backend container
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymsense
      POSTGRES_PASSWORD: gymsense
      POSTGRES_DB: gymsense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymsense -d gymsense"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
