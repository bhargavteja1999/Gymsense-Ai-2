services:

  # ==========================================
  # BACKEND - FastAPI
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+psycopg://gymsense:gymsense@postgres:5432/gymsense
      CORS_ORIGINS: http://localhost:8080
      ENVIRONMENT: production-like
      APP_VERSION: "0.1.0"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================
  # FRONTEND - React + Nginx
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ""

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


  # ==========================================
  # DATABASE - PostgreSQL
  # ==========================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: gymsense
      POSTGRES_PASSWORD: gymsense
      POSTGRES_DB: gymsense

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U gymsense -d gymsense"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


# ==========================================
# VOLUMES
# ==========================================
volumes:
  pgdata:
